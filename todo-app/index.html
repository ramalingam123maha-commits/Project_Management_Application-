<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>To-Do List</h1>

      <form id="task-form" class="task-form">
        <input
          id="task-input"
          type="text"
          placeholder="Add a new task..."
          maxlength="200"
          required
        />
        <button type="submit">Add</button>
      </form>

      <ul id="task-list" class="task-list"></ul>

      <p id="empty-state" class="empty-state" hidden>No tasks yet. Add one above!</p>
    </main>

    <!-- Inline/dialog edit modal -->
    <dialog id="edit-dialog" class="edit-dialog">
      <form id="edit-form" method="dialog">
        <h2>Edit Task</h2>
        <input id="edit-input" type="text" maxlength="200" required />
        <div class="dialog-actions">
          <button type="button" id="cancel-edit">Cancel</button>
          <button type="submit" id="save-edit">Save</button>
        </div>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
